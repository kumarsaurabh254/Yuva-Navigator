<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | SportFit Pathfinder</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">SF</span><span>SportFit Pathfinder</span></a><div class="header-actions"><a class="btn btn-light" href="index.html">Back to home</a></div></header>
<main class="auth-page"><section class="auth-card"><div class="brand"><span class="brand-mark">SF</span><span>SportFit Pathfinder</span></div><span class="eyebrow">CREATE YOUR PATH</span><h1>Create your account</h1><p>There are no pre-filled answers. You will complete your sports profile after signing in.</p><div id="error" class="auth-error"></div><form id="signupForm"><label>Full name<input id="name" placeholder="Your full name" required autocomplete="name"></label><label>Email<input id="email" placeholder="you@example.com" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" minlength="6" required autocomplete="new-password" spellcheck="false"><small class="field-hint">Minimum 6 characters.</small></label><label>Confirm password<input id="confirm" type="password" minlength="6" required autocomplete="new-password" spellcheck="false"><small id="passwordStatus" class="field-hint"></small></label><label class="show-password"><input id="showPasswords" type="checkbox"> Show passwords</label><button class="btn btn-primary full" type="submit">Create account</button></form><p>Already have an account? <a class="text-link" href="login.html">Log in</a></p></section></main>
<script src="auth.js?v=3"></script></body></html>
